[rule]
id = "etap-002"
name = "Attempt to Disable Windows Defender Services"
description = "Detects attempts to stop or disable Windows Defender services via sc.exe, net.exe, or PowerShell Set-MpPreference."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("sc.exe") and process.command_line : ("stop", "delete", "config") and process.command_line : ("WinDefend", "WdFilter", "WdNisSvc", "WdNisDrv", "Sense"))
  or (process.name in~ ("net.exe", "net1.exe") and process.command_line : "stop" and process.command_line : ("WinDefend", "WdFilter", "WdNisSvc"))
  or (process.name in~ ("powershell.exe", "pwsh.exe") and process.command_line : "Set-MpPreference" and process.command_line : ("DisableRealtimeMonitoring", "DisableBehaviorMonitoring", "DisableIOAVProtection", "DisableScriptScanning"))
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1562.001"
name = "Impair Defenses: Disable or Modify Tools"

[[tests]]
name = "stop defender service"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "sc.exe", executable = "C:\\Windows\\System32\\sc.exe", command_line = "sc.exe stop WinDefend" } }

[[tests]]
name = "disable realtime monitoring"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Set-MpPreference -DisableRealtimeMonitoring $true" } }

[[tests]]
name = "query service"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "sc.exe", executable = "C:\\Windows\\System32\\sc.exe", command_line = "sc.exe query WinDefend" } }

[[tests]]
name = "read preferences"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Get-MpPreference" } }
