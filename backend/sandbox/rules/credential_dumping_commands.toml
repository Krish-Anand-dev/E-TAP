[rule]
id = "etap-039"
name = "Credential Dumping Command"
description = "Command lines for known password-dumping tools and techniques: Mimikatz, LSASS memory dumps, saved SAM hives, NTDS copies."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  process.command_line : ("sekurlsa", "lsadump", "mimikatz", "Invoke-Mimikatz", "pypykatz", "nanodump", "Out-Minidump", "comsvcs.dll, MiniDump", "comsvcs.dll,MiniDump", "ntdsutil", "/fullmemdmp")
  or (process.command_line : "lsass" and process.command_line : ("procdump", "createdump", "-ma ", "-mm ", "MiniDump", "comsvcs"))
  or (process.name in~ ("reg.exe") and process.command_line : " save " and process.command_line : ("hklm\\sam", "hklm\\security", "hklm\\system"))
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Credential Access"
[[threat.technique]]
id = "T1003.001"
name = "OS Credential Dumping: LSASS Memory"
[[threat.technique]]
id = "T1003.002"
name = "OS Credential Dumping: Security Account Manager"
[[threat.technique]]
id = "T1003.003"
name = "OS Credential Dumping: NTDS"

[[tests]]
name = "comsvcs minidump"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "rundll32.exe", executable = "C:\\Windows\\System32\\rundll32.exe", command_line = "rundll32.exe C:\\windows\\System32\\comsvcs.dll, MiniDump 612 C:\\x.dmp full" } }

[[tests]]
name = "procdump lsass"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "procdump.exe", executable = "C:\\Windows\\System32\\procdump.exe", command_line = "procdump.exe -accepteula -ma lsass.exe l.dmp" } }

[[tests]]
name = "reg save sam"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "reg.exe", executable = "C:\\Windows\\System32\\reg.exe", command_line = "reg.exe save HKLM\\SAM C:\\sam.hive" } }

[[tests]]
name = "mimikatz"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "mimikatz.exe", executable = "C:\\Windows\\System32\\mimikatz.exe", command_line = "mimikatz.exe sekurlsa::logonpasswords" } }

[[tests]]
name = "list lsass"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "tasklist.exe", executable = "C:\\Windows\\System32\\tasklist.exe", command_line = "tasklist /fi \"imagename eq lsass.exe\"" } }

[[tests]]
name = "read sam key"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "reg.exe", executable = "C:\\Windows\\System32\\reg.exe", command_line = "reg.exe query HKLM\\SAM" } }
