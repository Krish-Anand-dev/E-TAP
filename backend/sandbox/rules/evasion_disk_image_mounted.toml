[rule]
id = "etap-052"
name = "Disk Image (ISO, IMG or VHD) Mounted by a Script or Program"
description = "A script or program mounts a disk image file; files inside a mounted image skip the downloaded-from-the-internet warning. Limitation: this rule only sees the process command line, so it can miss encoded PowerShell and diskpart scripts run from a file."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("powershell.exe", "pwsh.exe")
    and process.command_line : (" Mount-DiskImage", "\"Mount-DiskImage", "'Mount-DiskImage", ";Mount-DiskImage", "(Mount-DiskImage",
                                " Mount-VHD", "\"Mount-VHD", "'Mount-VHD", ";Mount-VHD", "(Mount-VHD"))
  or (process.name in~ ("diskpart.exe")
    and process.command_line : "attach vdisk")
'''

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1553.005"
name = "Subvert Trust Controls: Mark-of-the-Web Bypass"

[[tests]]
name = "powershell mounts an iso"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", command_line = "powershell -c Mount-DiskImage -ImagePath C:\\Users\\Public\\invoice.iso" } }

[[tests]]
name = "powershell mounts a vhd"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "pwsh.exe", executable = "C:\\Program Files\\PowerShell\\7\\pwsh.exe", command_line = "pwsh -c Mount-VHD C:\\Temp\\data.vhd" } }

[[tests]]
name = "diskpart attaches a virtual disk"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "diskpart.exe", executable = "C:\\Windows\\System32\\diskpart.exe", command_line = "diskpart attach vdisk" } }

[[tests]]
name = "normal program with iso in its name"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "isosurface.exe", executable = "C:\\Program Files\\Isosurface\\isosurface.exe", command_line = "isosurface.exe --open model.dat" } }

[[tests]]
name = "powershell listing disk images without mounting"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", command_line = "powershell Get-ChildItem C:\\Downloads\\*.iso" } }

[[tests]]
name = "powershell only querying a disk image"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", command_line = "powershell -c Get-DiskImage -ImagePath C:\\Users\\Public\\invoice.iso" } }

[[tests]]
name = "powershell dismounting a disk image"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", command_line = "powershell -c Dismount-DiskImage -ImagePath C:\\Users\\Public\\invoice.iso" } }
