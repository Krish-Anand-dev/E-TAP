[rule]
id = "etap-040"
name = "Stored Credentials Listed or Browser Passwords Copied"
description = "Commands that list saved Windows credentials or copy browser password databases."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("cmdkey.exe", "vaultcmd.exe") and process.command_line : "/list")
  or (process.name in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "xcopy.exe") and process.command_line : ("Login Data", "logins.json", "key4.db", "\\Google\\Chrome\\User Data", "\\Mozilla\\Firefox\\Profiles"))
'''

[[threat]]
tactic.name = "Credential Access"
[[threat.technique]]
id = "T1555.004"
name = "Credentials from Password Stores: Windows Credential Manager"
[[threat.technique]]
id = "T1555.003"
name = "Credentials from Password Stores: Credentials from Web Browsers"

[[tests]]
name = "cmdkey list"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmdkey.exe", executable = "C:\\Windows\\System32\\cmdkey.exe", command_line = "cmdkey.exe /list" } }

[[tests]]
name = "copy browser db"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmd.exe", executable = "C:\\Windows\\System32\\cmd.exe", command_line = "cmd.exe /c copy \"%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Login Data\" C:\\x.db" } }

[[tests]]
name = "add credential"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmdkey.exe", executable = "C:\\Windows\\System32\\cmdkey.exe", command_line = "cmdkey.exe /generic:x /user:y" } }

[[tests]]
name = "directory listing"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmd.exe", executable = "C:\\Windows\\System32\\cmd.exe", command_line = "cmd.exe /c dir C:\\Users" } }
