[rule]
id = "etap-028"
name = "AMSI Bypass in a PowerShell Command"
description = "PowerShell command text that references the internal names used to switch off the Antimalware Scan Interface."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  process.name in~ ("powershell.exe", "pwsh.exe")
  and process.command_line : ("amsiInitFailed", "AmsiUtils", "amsiContext", "AmsiScanBuffer")
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1562.001"
name = "Impair Defenses: Disable or Modify Tools"

[[tests]]
name = "amsiInitFailed"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell [Ref].Assembly.GetType('System.Management.Automation.AmsiUtils').GetField('amsiInitFailed','NonPublic,Static').SetValue($null,$true)" } }

[[tests]]
name = "ordinary command"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Get-Process" } }
