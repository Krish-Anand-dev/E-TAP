[rule]
id = "etap-008"
name = "Encoded PowerShell Command"
description = "PowerShell started with an encoded command or a Base64 decode, which hides what the script does."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  process.name in~ ("powershell.exe", "pwsh.exe")
  and process.command_line : (" -enc", " -ec ", " -e ", "FromBase64String")
'''

[[threat]]
tactic.name = "Execution"
[[threat.technique]]
id = "T1059.001"
name = "Command and Scripting Interpreter: PowerShell"

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1027"
name = "Obfuscated Files or Information"

[[tests]]
name = "encoded command"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell.exe -NoP -W Hidden -enc JABzAD0ATgBlAHcA" } }

[[tests]]
name = "short flag"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "pwsh.exe", executable = "C:\\Windows\\System32\\pwsh.exe", command_line = "pwsh -e SQBFAFgA" } }

[[tests]]
name = "base64 decode"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell [Convert]::FromBase64String('aGk=')" } }

[[tests]]
name = "plain script file"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell.exe -File C:\\scripts\\backup.ps1" } }

[[tests]]
name = "other program"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmd.exe", executable = "C:\\Windows\\System32\\cmd.exe", command_line = "cmd.exe /c echo hello" } }
