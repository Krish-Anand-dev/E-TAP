[rule]
id = "etap-030"
name = "Downloaded-File Warning (Mark of the Web) Removed"
description = "A command that strips the Zone.Identifier marker Windows adds to downloaded files, so no warning is shown when they open."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("powershell.exe", "pwsh.exe") and process.command_line : "Unblock-File")
  or process.command_line : "Zone.Identifier"
'''

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1553.005"
name = "Subvert Trust Controls: Mark-of-the-Web Bypass"

[[tests]]
name = "unblock-file"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Unblock-File C:\\x.exe" } }

[[tests]]
name = "delete stream"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "cmd.exe", executable = "C:\\Windows\\System32\\cmd.exe", command_line = "cmd.exe /c del C:\\x.exe:Zone.Identifier" } }

[[tests]]
name = "ordinary listing"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Get-ChildItem" } }
