[rule]
id = "etap-022"
name = "Windows Firewall Disabled"
description = "A command that switches the Windows firewall off."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("netsh.exe") and process.command_line : ("state off", "opmode disable", "opmode mode=disable"))
  or (process.name in~ ("powershell.exe", "pwsh.exe") and process.command_line : "Set-NetFirewallProfile" and process.command_line : ("-Enabled False", "-Enabled 0"))
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1562.004"
name = "Impair Defenses: Disable or Modify System Firewall"

[[tests]]
name = "netsh advfirewall"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "netsh.exe", executable = "C:\\Windows\\System32\\netsh.exe", command_line = "netsh advfirewall set allprofiles state off" } }

[[tests]]
name = "netsh firewall"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "netsh.exe", executable = "C:\\Windows\\System32\\netsh.exe", command_line = "netsh firewall set opmode disable" } }

[[tests]]
name = "powershell"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Set-NetFirewallProfile -Profile Domain -Enabled False" } }

[[tests]]
name = "list interfaces"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "netsh.exe", executable = "C:\\Windows\\System32\\netsh.exe", command_line = "netsh interface show interface" } }

[[tests]]
name = "show profiles"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "netsh.exe", executable = "C:\\Windows\\System32\\netsh.exe", command_line = "netsh advfirewall show allprofiles" } }
