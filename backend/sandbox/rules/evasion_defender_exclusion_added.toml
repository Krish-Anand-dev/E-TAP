[rule]
id = "etap-021"
name = "Windows Defender Exclusion Added"
description = "A command that tells Windows Defender to ignore a folder, file type or process, or wipes its detection data."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process where
  (process.name in~ ("powershell.exe", "pwsh.exe") and process.command_line : "Add-MpPreference" and process.command_line : ("-ExclusionPath", "-ExclusionExtension", "-ExclusionProcess", "-ExclusionIpAddress"))
  or (process.name in~ ("mpcmdrun.exe") and process.command_line : ("-removedefinitions", "-disablerealtime"))
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Defense Evasion"
[[threat.technique]]
id = "T1562.001"
name = "Impair Defenses: Disable or Modify Tools"

[[tests]]
name = "exclusion"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell -c Add-MpPreference -ExclusionPath C:\\Users\\Public" } }

[[tests]]
name = "remove definitions"
expect = "match"
event = { _category = "process", event = { action = "start" }, process = { name = "MpCmdRun.exe", executable = "C:\\Windows\\System32\\MpCmdRun.exe", command_line = "MpCmdRun.exe -RemoveDefinitions -All" } }

[[tests]]
name = "status check"
expect = "no_match"
event = { _category = "process", event = { action = "start" }, process = { name = "powershell.exe", executable = "C:\\Windows\\System32\\powershell.exe", command_line = "powershell Get-MpComputerStatus" } }
