[rule]
id = "etap-038"
name = "LSASS Memory Read by Another Process"
description = "A process opening the Windows credential process (lsass.exe) with read-memory rights, as password dumpers do."
version = "1"
author = "E-TAP team"
license = "MIT"
os_list = ["windows"]
query = '''process_access where
  target.process.name in~ ("lsass.exe")
  and process_access.granted_access in~ ("0x1010", "0x1410", "0x1438", "0x143a", "0x1f0fff", "0x1f1fff", "0x1f2fff", "0x1f3fff", "0x1fffff")
  and not process.name in~ ("lsass.exe", "csrss.exe", "wininit.exe", "services.exe", "svchost.exe", "msmpeng.exe", "wmiprvse.exe")
'''

[[actions]]
action = "kill_process"

[[threat]]
tactic.name = "Credential Access"
[[threat.technique]]
id = "T1003.001"
name = "OS Credential Dumping: LSASS Memory"

[[tests]]
name = "read memory"
expect = "match"
event = { _category = "process_access", event = { action = "access" }, process = { name = "update.exe", executable = "C:\\Windows\\System32\\update.exe", command_line = "update.exe" }, target = { process = { name = "lsass.exe", executable = "C:\\Windows\\System32\\lsass.exe", command_line = "lsass.exe" } }, process_access = { granted_access = "0x1410" } }

[[tests]]
name = "all access"
expect = "match"
event = { _category = "process_access", event = { action = "access" }, process = { name = "x.exe", executable = "C:\\Windows\\System32\\x.exe", command_line = "x.exe" }, target = { process = { name = "lsass.exe", executable = "C:\\Windows\\System32\\lsass.exe", command_line = "lsass.exe" } }, process_access = { granted_access = "0x1fffff" } }

[[tests]]
name = "query-only access"
expect = "no_match"
event = { _category = "process_access", event = { action = "access" }, process = { name = "update.exe", executable = "C:\\Windows\\System32\\update.exe", command_line = "update.exe" }, target = { process = { name = "lsass.exe", executable = "C:\\Windows\\System32\\lsass.exe", command_line = "lsass.exe" } }, process_access = { granted_access = "0x1000" } }

[[tests]]
name = "system process"
expect = "no_match"
event = { _category = "process_access", event = { action = "access" }, process = { name = "svchost.exe", executable = "C:\\Windows\\System32\\svchost.exe", command_line = "svchost.exe" }, target = { process = { name = "lsass.exe", executable = "C:\\Windows\\System32\\lsass.exe", command_line = "lsass.exe" } }, process_access = { granted_access = "0x1410" } }

[[tests]]
name = "other target"
expect = "no_match"
event = { _category = "process_access", event = { action = "access" }, process = { name = "update.exe", executable = "C:\\Windows\\System32\\update.exe", command_line = "update.exe" }, target = { process = { name = "notepad.exe", executable = "C:\\Windows\\System32\\notepad.exe", command_line = "notepad.exe" } }, process_access = { granted_access = "0x1410" } }
